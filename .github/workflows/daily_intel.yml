name: 每日越南投资情报自动化巡检与推送

on:
  # 停用 GitHub Actions 云端定时跑，避免无大模型盲跑工商或冗余触发
  # 如需云端触发可手动在 Actions 页面点击 workflow_dispatch
  workflow_dispatch:

jobs:
  run-intel-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装运行依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行全网核心源巡检与采集
        run: |
          python run_all.py

      - name: 编译最新 HTML 简报与 RSS Feed
        run: |
          python scripts/stage2/generate_html_report.py
          python scripts/stage2/generate_rss_feed.py

      - name: 提交并推送最新数据与简报
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): 自动更新每日投资情报简报与RSS [$(date +'%Y-%m-%d')]" && git push)
